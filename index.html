<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SABI — little things worth remembering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Patrick+Hand&family=Pinyon+Script&family=Caveat:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a0810;
  }

  /* ══════════════════════════════════════════
     SCENE
  ══════════════════════════════════════════ */
  .scene {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Rustic wooden table background ── */
  .bg {
    position: absolute; inset: 0;
    background:
      /* Dark wooden table base */
      linear-gradient(135deg, #1f0b0a 0%, #1a0706 100%),
      /* Wood grain texture */
      url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cfilter id='wood'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.015' numOctaves='4'/%3E%3CfeColorMatrix type='saturate' values='0.3'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='100%25' height='100%25' filter='url(%23wood)' opacity='0.15'/%3E%3C/svg%3E"),
      /* Subtle radial depth */
      radial-gradient(ellipse 80% 70% at 50% 50%, rgba(45,15,20,0.85) 0%, rgba(30,10,15,0.9) 40%, rgba(15,5,8,0.95) 80%, #080208 100%);
  }

  /* Warm candlelight glow center */
  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 50% 52%,
        rgba(200, 100, 60, 0.18) 0%,
        rgba(160, 60, 40, 0.10) 40%,
        transparent 75%
      ),
      radial-gradient(ellipse 30% 25% at 50% 48%,
        rgba(255, 180, 80, 0.08) 0%,
        transparent 60%
      );
    pointer-events: none;
  }

  /* Vignette */
  .bg-vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 100% 100% at 50% 50%,
      transparent 40%,
      rgba(5, 0, 5, 0.7) 100%
    );
    pointer-events: none;
  }

  /* ── Floating petals ── */
  .petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .petal {
    position: absolute;
    border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%;
    opacity: 0;
    animation: petalFall linear infinite;
  }

  @keyframes petalFall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(1);   opacity: 0; }
    5%   { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(110vh) rotate(720deg) scale(0.6); opacity: 0; }
  }

  /* ══════════════════════════════════════════
     BOOK — the diary on a surface
  ══════════════════════════════════════════ */
  .book-scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  /* Surface / table the book rests on */
  .book-surface {
    position: absolute;
    bottom: -18px;
    left: -12%; right: -12%;
    height: 36px;
    background: linear-gradient(to bottom,
      rgba(120, 55, 30, 0.5),
      rgba(80, 30, 15, 0.2)
    );
    border-radius: 50%;
    filter: blur(8px);
    pointer-events: none;
  }

  /* Main book */
  .book {
    position: relative;
    width: min(300px, 58vw);
    aspect-ratio: 0.72;
    cursor: pointer;
    transition: transform 0.4s ease;
    transform-style: preserve-3d;
    perspective: 1200px;
  }

  .book:hover { transform: translateY(-8px) rotate(-1deg); }

  /* Cover */
  .book-cover {
    position: absolute; inset: 0;
    border-radius: 4px 14px 14px 4px;
    background:
      /* Fabric weave */
      repeating-linear-gradient(45deg,
        rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px,
        transparent 1px, transparent 7px
      ),
      repeating-linear-gradient(-45deg,
        rgba(255,255,255,0.02) 0, rgba(255,255,255,0.02) 1px,
        transparent 1px, transparent 7px
      ),
      /* Cover — deep mauve/burgundy */
      linear-gradient(155deg,
        #8c3f5a 0%,
        #6e2a45 20%,
        #5a2038 50%,
        #6e2a45 78%,
        #8c3f5a 100%
      );
    overflow: hidden;
    box-shadow:
      6px 0 0 #3a1020,
      8px 0 20px rgba(0,0,0,0.6),
      inset -2px 0 8px rgba(0,0,0,0.3),
      inset 2px 0 6px rgba(255,180,160,0.08);
  }

  /* Cover sheen */
  .book-cover::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 65% 20%,
      rgba(255, 220, 200, 0.12) 0%,
      transparent 65%
    );
    pointer-events: none;
  }

  /* Stitched border */
  .book-cover::after {
    content: '';
    position: absolute;
    inset: 5%;
    border: 1px dashed rgba(255, 200, 180, 0.2);
    border-radius: 2px 10px 10px 2px;
    pointer-events: none;
  }

  /* Spine strip */
  .book-spine {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 10%;
    background: linear-gradient(90deg,
      #2a0e1a 0%,
      #3d1525 60%,
      transparent 100%
    );
    border-radius: 4px 0 0 4px;
    pointer-events: none;
  }

  /* Spine line detail */
  .book-spine::after {
    content: '';
    position: absolute;
    top: 8%; bottom: 8%;
    right: 0;
    width: 1px;
    background: linear-gradient(to bottom,
      transparent, rgba(180, 100, 100, 0.3) 30%,
      rgba(180, 100, 100, 0.3) 70%, transparent
    );
  }

  /* Pages edge — right side stack */
  .book-pages {
    position: absolute;
    top: 1%; bottom: 1%; right: -5px;
    width: 8px;
    background: repeating-linear-gradient(
      to bottom,
      #f0e4d4, #f0e4d4 1px,
      #e8d8c4 1px, #e8d8c4 2px
    );
    border-radius: 0 2px 2px 0;
    box-shadow: 2px 0 6px rgba(0,0,0,0.3);
    pointer-events: none;
  }

  /* ── Decorative flowers on cover (SVG) ── */
  .cover-flowers {
    position: absolute; inset: 0;
    pointer-events: none;
  }

  /* ── Cover text ── */
  .cover-text {
    position: absolute;
    top: 50%; left: 52%;
    transform: translate(-50%, -54%);
    text-align: center;
    width: 68%;
    pointer-events: none;
  }

  .cover-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 5vw, 2.4rem);
    font-weight: 400;
    letter-spacing: 0.35em;
    color: #f5dcc8;
    text-shadow: 0 0 20px rgba(255,160,100,0.4), 0 2px 4px rgba(0,0,0,0.4);
    display: block;
    margin-bottom: 5%;
  }

  .cover-rule {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 6%; opacity: 0.7;
  }
  .cover-rule span {
    display: block; height: 1px; width: 24px;
    background: linear-gradient(90deg, transparent, #f0c8a0, transparent);
  }
  .cover-rule em {
    font-style: normal; font-size: clamp(0.5rem, 1.2vw, 0.8rem);
    color: #f0c8a0;
  }

  .cover-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.42rem, 1.1vw, 0.72rem);
    font-weight: 300;
    color: rgba(240, 210, 185, 0.82);
    letter-spacing: 0.12em;
    line-height: 1.8;
    display: block;
    margin-bottom: 8%;
  }

  .cover-year {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.45rem, 1.1vw, 0.72rem);
    font-weight: 300;
    letter-spacing: 0.28em;
    color: rgba(240, 210, 185, 0.7);
    display: block;
    margin-bottom: 5%;
  }

  .cover-ornament {
    font-size: clamp(0.38rem, 0.85vw, 0.58rem);
    color: rgba(230, 185, 155, 0.5);
    letter-spacing: 0.2em;
    display: block;
  }

  /* Ribbon bookmark */
  .book-ribbon {
    position: absolute;
    bottom: -7%; left: 55%;
    width: 7%;
    height: 16%;
    background: linear-gradient(180deg, #c06878 0%, #a04858 100%);
    clip-path: polygon(20% 0%, 80% 0%, 100% 80%, 50% 100%, 0% 80%);
    pointer-events: none;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }

  /* ══════════════════════════════════════════
     CONTENT AROUND THE BOOK
  ══════════════════════════════════════════ */

  /* Top title text — above book */
  .page-title {
    text-align: center;
    margin-bottom: clamp(18px, 3vh, 36px);
    pointer-events: none;
  }

  .page-title__eyebrow {
    font-family: 'Caveat', cursive;
    font-size: clamp(0.65rem, 1.5vw, 0.95rem);
    color: rgba(210, 150, 130, 0.7);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }

  .page-title__main {
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(2.2rem, 6vw, 4.2rem);
    color: #f0d0b8;
    text-shadow:
      0 0 40px rgba(200, 100, 60, 0.5),
      0 0 80px rgba(180, 60, 40, 0.25),
      0 2px 8px rgba(0,0,0,0.5);
    display: block;
    line-height: 1;
  }

  /* Bottom — "open me" button */
  .open-wrap {
    margin-top: clamp(22px, 3.5vh, 42px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .open-btn {
    background: none;
    border: 1px solid rgba(200, 140, 110, 0.4);
    border-radius: 50px;
    padding: clamp(8px, 1.4vh, 14px) clamp(24px, 4vw, 48px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease, transform 0.3s ease;
    animation: btnPulse 3s ease-in-out infinite;
  }

  .open-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg,
      rgba(180, 80, 80, 0.0),
      rgba(180, 80, 80, 0.12)
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: inherit;
  }

  .open-btn:hover {
    border-color: rgba(220, 170, 140, 0.7);
    transform: translateY(-3px);
  }
  .open-btn:hover::before { opacity: 1; }
  .open-btn:focus { outline: none; }

  .open-btn__text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.75rem, 1.8vw, 1.1rem);
    color: rgba(240, 210, 190, 0.88);
    letter-spacing: 0.18em;
    position: relative;
    z-index: 1;
  }

  .open-btn__heart {
    font-size: clamp(0.55rem, 1.1vw, 0.78rem);
    color: rgba(200, 120, 110, 0.75);
    letter-spacing: 0.1em;
    display: block;
    text-align: center;
    animation: heartBeat 1.8s ease-in-out infinite;
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(180,80,80,0); }
    50%       { box-shadow: 0 0 18px 4px rgba(180,80,80,0.14); }
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1);    opacity: 0.75; }
    30%       { transform: scale(1.25); opacity: 1; }
    60%       { transform: scale(0.95); opacity: 0.75; }
  }

  /* Subtle date / caption */
  .page-caption {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.52rem, 1.1vw, 0.72rem);
    color: rgba(200, 155, 135, 0.45);
    letter-spacing: 0.2em;
    text-align: center;
    margin-top: clamp(10px, 1.5vh, 18px);
    pointer-events: none;
  }

  /* ══════════════════════════════════════════
     OPENING ANIMATION
  ══════════════════════════════════════════ */
  .scene.is-opening .book {
    animation: bookOpen 1s cubic-bezier(0.4,0,0.2,1) forwards;
    pointer-events: none;
  }

  @keyframes bookOpen {
    0%   { transform: translateY(-8px) rotate(-1deg) rotateY(0deg); }
    15%  { transform: translateY(-14px) rotate(-1deg) rotateY(-12deg) scale(1.04); }
    100% { transform: translateY(-8px) rotate(-1deg) rotateY(-100deg) scale(1.06); }
  }

  .fade-veil {
    position: fixed; inset: 0;
    background: #1a0810;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .fade-veil.show { opacity: 1; }

  /* ══════════════════════════════════════════
     RESPONSIVE
  ══════════════════════════════════════════ */
  @media (max-width: 500px) {
    .book { width: 68vw; }
    .page-title__main { font-size: 2.4rem; }
  }
  </style>
</head>
<body>

<div class="fade-veil" id="veil"></div>

<div class="scene" id="scene">

  <!-- Background layers -->
  <div class="bg"></div>
  <div class="bg-glow"></div>
  <div class="bg-vignette"></div>

  <!-- Floating petals -->
  <div class="petals" id="petals"></div>

  <!-- Main content -->
  <div class="book-scene">

    <!-- Title above book -->
    <div class="page-title">
      <span class="page-title__eyebrow">a gift, just for you</span>
      <!-- <span class="page-title__main">SABI</span> -->
    </div>

    <!-- THE BOOK -->
    <div class="book" id="book" role="button" tabindex="0" aria-label="Open the diary">

      <div class="book-cover">
        <div class="book-spine"></div>

        <!-- Flowers SVG — top right on cover -->
        <div class="cover-flowers">
          <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Top right sprig -->
            <path d="M180 5 Q165 20 148 35 Q132 50 118 60" stroke="rgba(200,150,140,0.5)" stroke-width="1.2" fill="none"/>
            <path d="M148 35 Q140 28 135 18" stroke="rgba(200,150,140,0.45)" stroke-width="1" fill="none"/>
            <path d="M163 18 Q155 25 152 35" stroke="rgba(200,150,140,0.4)" stroke-width="1" fill="none"/>
            <!-- Petals top-right -->
            <circle cx="118" cy="60" r="5" fill="rgba(220,160,160,0.6)"/>
            <circle cx="113" cy="56" r="3.5" fill="rgba(200,140,145,0.55)"/>
            <circle cx="123" cy="56" r="3" fill="rgba(235,175,170,0.55)"/>
            <circle cx="116" cy="65" r="2.5" fill="rgba(210,150,155,0.5)"/>
            <circle cx="135" cy="18" r="4.5" fill="rgba(220,160,160,0.6)"/>
            <circle cx="130" cy="14" r="3" fill="rgba(200,140,145,0.55)"/>
            <circle cx="140" cy="14" r="2.5" fill="rgba(235,175,170,0.5)"/>
            <circle cx="163" cy="18" r="3" fill="rgba(220,160,160,0.55)"/>
            <circle cx="158" cy="14" r="2" fill="rgba(200,140,145,0.5)"/>
            <circle cx="180" cy="5"  r="3.5" fill="rgba(235,175,170,0.5)"/>
            <!-- Bottom right sprig -->
            <path d="M185 275 Q168 258 152 240 Q138 224 128 212" stroke="rgba(200,150,140,0.5)" stroke-width="1.2" fill="none"/>
            <path d="M152 240 Q144 232 140 220" stroke="rgba(200,150,140,0.45)" stroke-width="1" fill="none"/>
            <path d="M168 255 Q160 248 158 238" stroke="rgba(200,150,140,0.4)" stroke-width="1" fill="none"/>
            <circle cx="128" cy="212" r="5"   fill="rgba(220,160,160,0.6)"/>
            <circle cx="123" cy="208" r="3.5" fill="rgba(200,140,145,0.55)"/>
            <circle cx="133" cy="208" r="3"   fill="rgba(235,175,170,0.55)"/>
            <circle cx="126" cy="217" r="2.5" fill="rgba(210,150,155,0.5)"/>
            <circle cx="140" cy="220" r="4"   fill="rgba(220,160,160,0.6)"/>
            <circle cx="135" cy="215" r="2.5" fill="rgba(200,140,145,0.55)"/>
            <circle cx="158" cy="238" r="3.5" fill="rgba(220,160,160,0.55)"/>
            <circle cx="153" cy="234" r="2"   fill="rgba(200,140,145,0.5)"/>
          </svg>
        </div>

        <!-- Cover text -->
        <div class="cover-text">
          <span class="cover-title">SABI</span>
          <div class="cover-rule"><span></span><em>♡</em><span></span></div>
          <span class="cover-sub">little things<br>worth remembering</span>
          <span class="cover-year">2 0 2 6</span>
          <span class="cover-ornament">— ❧ —</span>
        </div>

      </div>

      <!-- Pages edge -->
      <div class="book-pages"></div>

      <!-- Ribbon bookmark -->
      <div class="book-ribbon"></div>

      <!-- Book surface shadow -->
      <div class="book-surface"></div>

    </div>

    <!-- Open me button -->
    <div class="open-wrap">
      <button class="open-btn" id="openBtn" aria-label="Open the diary">
        <span class="open-btn__text">open me</span>
      </button>
      <span class="open-btn__heart">♡</span>
    </div>

    <!-- <p class="page-caption">little things worth remembering</p> -->

  </div>

</div>

<script>
/* ── Generate floating petals ── */
(function() {
  const container = document.getElementById('petals');
  const colors = [
    'rgba(180,80,100,0.55)',
    'rgba(200,110,120,0.45)',
    'rgba(220,140,140,0.4)',
    'rgba(160,60,90,0.5)',
    'rgba(240,170,170,0.35)',
    'rgba(200,100,110,0.5)',
  ];

  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'petal';

    const size   = 4 + Math.random() * 10;
    const left   = Math.random() * 100;
    const delay  = Math.random() * 18;
    const dur    = 12 + Math.random() * 16;
    const color  = colors[Math.floor(Math.random() * colors.length)];

    p.style.cssText = `
      width:${size}px; height:${size * 0.65}px;
      left:${left}%;
      top: -${size}px;
      background:${color};
      animation-duration:${dur}s;
      animation-delay:${delay}s;
      transform-origin: center;
    `;
    container.appendChild(p);
  }
})();

/* ── Open interaction ── */
let opened = false;

function openDiary() {
  if (opened) return;
  opened = true;

  document.getElementById('scene').classList.add('is-opening');

  setTimeout(() => {
    document.getElementById('veil').classList.add('show');
  }, 750);

  setTimeout(() => {
    window.location.href = 'diary.html';
  }, 1400);
}

document.getElementById('book').addEventListener('click', openDiary);
document.getElementById('openBtn').addEventListener('click', openDiary);

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') openDiary();
});

window.addEventListener('pageshow', e => {
  if (e.persisted) {
    opened = false;
    document.getElementById('scene').classList.remove('is-opening');
    document.getElementById('veil').classList.remove('show');
  }
});

// ── Supabase auth guard for index page ──
if (typeof SupabaseSync !== 'undefined') {
  SupabaseSync.getSession().then(session => {
    // If there's a 'diary' link/button on this page, only navigate when authenticated
    // If not authenticated and user tries to navigate to diary.html, they'll hit the login overlay there.
    // No redirect here — just update any UI that should show auth state.
    const _diaryLinks = document.querySelectorAll('a[href*="diary"]');
    _diaryLinks.forEach(link => {
      if (!session) {
        link.addEventListener('click', (e) => {
          // Allow navigation — login overlay in diary.html will handle auth
        });
      }
    });
  }).catch(() => { /* Supabase unavailable — allow normal navigation */ });
}
</script>
</body>
</html>
